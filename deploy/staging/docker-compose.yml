# Déploiement staging — à copier dans /srv/hook/staging/ sur le VPS.
#
# Identique à la production, au tag et au nom près. Le .env de cet
# environnement doit pointer vers le bac à sable HelloAsso
# (api.helloasso-sandbox.com), une base Notion de test et des salons Discord de
# test : c'est tout l'intérêt de cet environnement, dérouler un vrai paiement —
# cotisation ou place de WEI — sans mouvement d'argent, sans polluer le salon du
# bureau, et sans tunnel vers un poste de développement.

name: hook-staging

services:
  app:
    image: ghcr.io/davincibot/helloasso-webhooks:staging
    container_name: hook-staging
    restart: unless-stopped
    env_file: .env
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'
    networks:
      - web

networks:
  web:
    external: true
